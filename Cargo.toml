[package]
name = "wiiload"
version = "0.7.1"
edition = "2024"
rust-version = "1.85"
authors = ["Manuel Quarneti <mq1@ik.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mq1/wiiload-rs"
homepage = "https://github.com/mq1/wiiload-rs"
description = "A minimal wiiload implementation in rust"

[features]
default = []
async = ["dep:futures-lite"]
compression = ["dep:flate2"]
compression-async = ["dep:async-compression"]
cli = ["dep:lexopt"]

[dependencies]
thiserror = "2"
futures-lite = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
async-compression = { version = "0.4", optional = true, features = [
  "zlib",
  "futures-io",
] }
lexopt = { version = "0.3", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
